name: Libyan Collector Bot
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Choose chat-id first, then test. Scan needs eBay production access.
        type: choice
        required: true
        default: test
        options: [chat-id, test, scan, digest]
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: libyan-collector-state
  cancel-in-progress: false
jobs:
  collector:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_EBAY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check behavior
        run: python -m unittest discover -s tests -v
      - name: Run bot
        env:
          MODE: ${{ inputs.mode || 'scan' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COLLECTOR_URL: https://libyan-collector-notifications.ahmedamaartrack.workers.dev
        run: python bot.py "$MODE"
